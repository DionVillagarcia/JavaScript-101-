      //auto-boxing *does not work with null/undefine = ERROR
      console.log("Hello".length); //variable length
      console.log("hello".toUpperCase()); //convert to upper case

      // Objects are reference
      const object1 = {
        message: "hello",
      };

      //copy by reference
      const object2 = object1;

      object1.message = "Good job!";
      console.log(object1);
      console.log(object2);

      const object3 = {
        message: "Good Job!",
      };

      console.log(object2 === object1);

      const object4 = {
        message: "Good Job!",
        price: 799,
      };

      const { message, price } = object4;

      console.log(price);
